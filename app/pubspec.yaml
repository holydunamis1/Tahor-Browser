name: tahorbrowser
description: Tahor Fast & Private Browser. A privacy-first browser with on-device ad blocking.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  flutter_inappwebview: 6.2.0-beta.3
  phosphoricons_flutter: 1.1.0
  pdfrx: 2.6.5
  mobile_scanner: 7.1.4
  qr: 4.0.0
  google_mobile_ads: 9.1.0
  in_app_purchase: 3.3.0
  background_downloader: 9.5.9
  http: 1.6.0
  google_mlkit_translation: 0.15.1
  google_mlkit_language_id: 0.14.0
  flutter_chrome_cast: 1.5.0
  sqflite: 2.4.4+2
  shared_preferences: 2.5.6
  path_provider: 2.1.6
  url_launcher: 6.3.3
  share_plus: 13.3.1
  open_file: 3.5.11
  local_auth: 3.0.2
  permission_handler: 13.0.2
  package_info_plus: 10.2.2
  cryptography: 2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.7

flutter:
  generate: true
  uses-material-design: false
