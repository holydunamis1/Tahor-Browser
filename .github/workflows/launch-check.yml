name: launch-check

# Manual. Builds a release APK for the x86_64 emulator, installs it, launches it
# and fails if the app crashes. This is the check that "verify" cannot do: verify
# proves the code analyses and its tests pass, not that the app starts.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launch-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the Flutter version pin
        id: fv
        run: echo "version=$(tr -d '[:space:]' < tool/flutter_version.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fv.outputs.version }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: bash ../tool/ci_run.sh pub-get flutter pub get

      - name: Generate localizations
        working-directory: app
        run: bash ../tool/ci_run.sh gen-l10n flutter gen-l10n

      - name: Build the release APK for x86_64
        working-directory: app
        env:
          CI_SHOW: '1'
        run: bash ../tool/ci_run.sh build-x64 flutter build apk --release --target-platform android-x64

      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and check on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          CI_SHOW: '1'
        with:
          api-level: 30
          profile: pixel_5
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tool/ci_run.sh launch-check bash tool/launch_check.sh app/build/app/outputs/flutter-apk/app-release.apk com.zdmgold.tahorbrowser

      - name: Publish the screenshots to the ci-screenshots branch
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tool/ci_run.sh publish-shots bash tool/publish_screenshots.sh
