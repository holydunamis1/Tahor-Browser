name: integration-android

# Manual. Runs the integration tests on an Android emulator with the real web
# view: pages load, tabs work, and a restart brings the tabs back. It builds
# the app, so it takes a while; run it at milestone exits and when a batch
# touches the engine, tabs or storage.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the Flutter version pin
        id: fv
        run: echo "version=$(tr -d '[:space:]' < tool/flutter_version.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fv.outputs.version }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: bash ../tool/ci_run.sh pub-get flutter pub get

      - name: Generate localizations
        working-directory: app
        run: bash ../tool/ci_run.sh gen-l10n flutter gen-l10n

      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the integration tests on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          CI_SHOW: '1'
        with:
          api-level: 30
          profile: pixel_5
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: app
          script: bash ../tool/ci_run.sh integration flutter test integration_test --no-pub
