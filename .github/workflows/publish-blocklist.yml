name: publish-blocklist

# Manual. Downloads EasyList and EasyPrivacy, converts them to the canonical
# format, signs the full list, and commits the results to the branch it runs on:
#   website/blocklist/{latest.txt,manifest.json,manifest.sig}  (published by the website)
#   app/assets/blocklist/{canonical_blocklist.txt,manifest.json,manifest.sig}  (the same list, bundled in the app)
# Run it on a batch branch to review the result in a pull request.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the Flutter version pin
        id: fv
        run: echo "version=$(tr -d '[:space:]' < tool/flutter_version.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter (it carries the Dart SDK)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fv.outputs.version }}
          channel: stable
          cache: true

      - name: Resolve the tool's dependencies
        working-directory: tools/blocklist
        run: bash ../../tool/ci_run.sh pub-get dart pub get

      - name: Download the upstream lists
        run: |
          set -euo pipefail
          mkdir -p /tmp/lists
          curl -fsSL --retry 3 -o /tmp/lists/easylist.txt https://easylist.to/easylist/easylist.txt
          curl -fsSL --retry 3 -o /tmp/lists/easyprivacy.txt https://easylist.to/easylist/easyprivacy.txt
          wc -l /tmp/lists/*.txt

      - name: Convert
        working-directory: tools/blocklist
        env:
          CI_SHOW: '1'
        run: |
          bash ../../tool/ci_run.sh convert dart run convert_abp_to_canonical.dart \
            --out-full /tmp/full.txt \
            /tmp/lists/easylist.txt /tmp/lists/easyprivacy.txt

      - name: Sign the full list
        working-directory: tools/blocklist
        env:
          BLOCKLIST_SIGNING_KEY_B64: ${{ secrets.BLOCKLIST_SIGNING_KEY_B64 }}
          CI_SHOW: '1'
        run: |
          set -euo pipefail
          mkdir -p ../../website/blocklist
          bash ../../tool/ci_run.sh sign dart run sign_blocklist.dart \
            --list /tmp/full.txt \
            --previous ../../website/blocklist/manifest.json \
            --out-manifest /tmp/manifest.json --out-sig /tmp/manifest.sig

      - name: Place the files
        run: |
          set -euo pipefail
          cp /tmp/full.txt website/blocklist/latest.txt
          cp /tmp/manifest.json website/blocklist/manifest.json
          cp /tmp/manifest.sig website/blocklist/manifest.sig
          mkdir -p app/assets/blocklist
          cp /tmp/full.txt app/assets/blocklist/canonical_blocklist.txt
          cp /tmp/manifest.json app/assets/blocklist/manifest.json
          cp /tmp/manifest.sig app/assets/blocklist/manifest.sig
          ls -l website/blocklist app/assets/blocklist

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/blocklist app/assets/blocklist
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "publish blocklist"
          git push
